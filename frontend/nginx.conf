server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/xml application/json image/svg+xml;

    # Security headers. The player embeds a third-party iframe (vidsrc) and the
    # movie page embeds YouTube trailers; the API may live on another origin.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://image.tmdb.org https://i.ytimg.com; frame-src https://*.vidsrc-embed.ru https://vidsrc-embed.ru https://www.youtube.com https://www.youtube-nocookie.com; connect-src 'self' https: http://localhost:8000; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'" always;

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite emits content-hashed files under /assets: cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://image.tmdb.org https://i.ytimg.com; frame-src https://*.vidsrc-embed.ru https://vidsrc-embed.ru https://www.youtube.com https://www.youtube-nocookie.com; connect-src 'self' https: http://localhost:8000; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'" always;
    }
}
