# Security headers for the self-hosted nginx image (Render sets its own in render.yaml; keep
# the two CSPs in step). Included in every block that uses add_header, because nginx drops
# inherited add_header directives as soon as a block declares its own.
# connect-src points at the API that docker compose runs on localhost:8000; change it if you
# build with a different VITE_API_BASE.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://image.tmdb.org; font-src 'self'; connect-src 'self' http://localhost:8000; frame-src https://vidsrc.sh https://www.youtube-nocookie.com https://www.youtube.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
