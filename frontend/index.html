<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5" />
    <meta name="author" content="AnyVod" />
    <meta name="theme-color" content="#0b0c0e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta property="og:site_name" content="AnyVod" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/clash-grotesk-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/clash-grotesk-500.woff2" as="font" type="font/woff2" crossorigin />

    <!--
      Per-page tags (<title>, description, robots, canonical, og:*, twitter:*) are rendered by
      src/components/Seo.tsx and hoisted into <head> by React 19.
      The data-seo-fallback tags below exist for link-preview crawlers (WhatsApp, Discord,
      iMessage, Slack...), which never run JS. React does not dedupe against them, so
      src/main.tsx removes every [data-seo-fallback] tag before the first render
      (see removeSeoFallback in src/lib/seo.ts).
    -->
    <title data-seo-fallback>AnyVod - Free Movie and TV Show Streaming</title>
    <meta data-seo-fallback name="description" content="Stream your favorite movies and TV shows for free. Discover trending films, popular series, and explore a vast library of entertainment content." />
    <meta data-seo-fallback property="og:type" content="website" />
    <meta data-seo-fallback property="og:url" content="https://vod.losingsanity.com/" />
    <meta data-seo-fallback property="og:title" content="AnyVod - Free Movie and TV Show Streaming" />
    <meta data-seo-fallback property="og:description" content="Stream your favorite movies and TV shows for free. Discover trending films, popular series, and explore a vast library of entertainment content." />
    <meta data-seo-fallback property="og:image" content="https://vod.losingsanity.com/og-image.png" />
    <meta data-seo-fallback property="og:image:width" content="1200" />
    <meta data-seo-fallback property="og:image:height" content="630" />
    <meta data-seo-fallback property="og:image:type" content="image/png" />
    <meta data-seo-fallback property="og:image:alt" content="AnyVod - Free Movie and TV Show Streaming" />
    <meta data-seo-fallback name="twitter:card" content="summary_large_image" />
    <meta data-seo-fallback name="twitter:title" content="AnyVod - Free Movie and TV Show Streaming" />
    <meta data-seo-fallback name="twitter:description" content="Stream your favorite movies and TV shows for free. Discover trending films, popular series, and explore a vast library of entertainment content." />
    <meta data-seo-fallback name="twitter:image" content="https://vod.losingsanity.com/og-image.png" />

    <!-- Schema.org Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "AnyVod",
      "url": "https://vod.losingsanity.com/",
      "description": "Stream your favorite movies and TV shows for free. Discover trending films, popular series, and explore a vast library of entertainment content.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://vod.losingsanity.com/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
