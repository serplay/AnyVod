<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5" />
    <meta name="author" content="AnyVod" />
    <meta name="theme-color" content="#1A1A1D" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta property="og:site_name" content="AnyVod" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <!--
      Per-page tags (<title>, description, robots, canonical, og:*, twitter:*) are rendered by
      src/components/Seo.tsx and hoisted into <head> by React 19. React does not dedupe against
      tags in this file, so do not add them back here. That includes a fallback <title>: React
      inserts its hoisted <title> next to an existing one instead of replacing it
      (see src/components/Seo.test.tsx).
    -->

    <!-- Schema.org Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "AnyVod",
      "url": "https://vod.losingsanity.com/",
      "description": "Stream your favorite movies and TV shows for free. Discover trending films, popular series, and explore a vast library of entertainment content.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://vod.losingsanity.com/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
