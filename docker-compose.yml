# Local development: builds both services from source.
services:
  backend:
    build:
      context: ./backend
    container_name: anyvod-backend
    ports:
      - "8000:8000"
    environment:
      - TMDB_API_KEY=${TMDB_API_KEY:?TMDB_API_KEY must be set}
      - VIDSRC_EMBED_DOMAIN=${VIDSRC_EMBED_DOMAIN:-vidsrc-embed.ru}
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-http://localhost:5173}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - RUST_LOG=${RUST_LOG:-info}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/local/bin/anyvod-backend", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_BASE=${VITE_API_BASE:-http://localhost:8000}
    container_name: anyvod-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
