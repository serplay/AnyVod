services:
  # Backend API (Rust, built from backend/Dockerfile)
  - type: web
    name: anyvod-backend
    runtime: docker
    region: oregon
    plan: free
    branch: main
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: TMDB_API_KEY
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: VIDSRC_EMBED_DOMAIN
        value: vidsrc-embed.ru
      - key: FRONTEND_ORIGIN
        fromService:
          type: web
          name: anyvod-frontend
          envVarKey: RENDER_EXTERNAL_URL

  # Frontend Static Site
  - type: web
    name: anyvod-frontend
    runtime: static
    branch: main
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE
        fromService:
          type: web
          name: anyvod-backend
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
