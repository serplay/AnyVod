# Production: same images, production CORS and restart policy.
services:
  backend:
    build:
      context: ./backend
    container_name: anyvod-backend-prod
    ports:
      - "8000:8000"
    environment:
      - TMDB_API_KEY=${TMDB_API_KEY:?TMDB_API_KEY must be set}
      - VIDSRC_EMBED_DOMAIN=${VIDSRC_EMBED_DOMAIN:-vidsrc.sh}
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-}
      - ENVIRONMENT=production
      - RUST_LOG=${RUST_LOG:-info}
    restart: always
    healthcheck:
      test: ["CMD", "/usr/local/bin/anyvod-backend", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_BASE=${VITE_API_BASE:-http://localhost:8000}
    container_name: anyvod-frontend-prod
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: always
